name: hello-from-R
on: push
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: hello-from-bash
        run: echo "Hello from Bash!"
        
      - name: checkout-repo
        uses: actions/checkout@v3
        
      - name: install-r
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      
      - name: Install deps
        run: sudo apt-get install openjdk-25-jdk r-cran-rjava r-cran-jsonlite r-cran-testthat libuv1-dev
        
      - name: Java release
        run: java -version
 
      - name: hello-r
        run: export JAVA_HOME='/usr/lib/jvm/default-java' && Rscript ./myscript.R
